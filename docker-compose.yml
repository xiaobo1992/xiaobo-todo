services:
  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
    restart: unless-stopped
    environment:
      TODO_DATA_FILE: /data/tasks.json
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
